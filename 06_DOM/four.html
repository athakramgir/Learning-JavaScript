<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 4</title>
</head>
<body style="background-color: #212121; color:#fff">
    <ul class="language">
        <li class="lang-name">JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(lang_name){
        const lang = document.createElement('li')
        lang.innerHTML = `${lang_name}` // we are talking about this line. 
        document.querySelector('.language').appendChild(lang);
    }//unoptimised due to innerHTML
    addLanguage('Python')
    addLanguage('C++')
    addLanguage('TypeScript')
    // the problem with this implementation of addLanguage() is that whenever we add some li, we have to traverse all the tree elements. This can become highly inefficient for larger websites. This is again happening because of the innerHTML as it traverse and fetches the data and then changes it. 

    function addLanguageOptimised(langName) {
        const li = document.createElement('li'); 
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    } // optimised
    addLanguageOptimised('GoLang')

    // Edit
    const secondLang = document.querySelector("li:nth-child(2)")
    // secondLang.innerHTML = "Mojo" // Python changed to mojo
    const newLi = document.createElement("li")
    newLi.textContent = "Mojo"
    document.querySelector("li:nth-child(2)").replaceWith(newLi)

    // Edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>Kotlin</li>"

    // Remove
    const lastLang = document.querySelector("li:last-child") 
    lastLang.remove() // GoLang removed
</script>
</html>
