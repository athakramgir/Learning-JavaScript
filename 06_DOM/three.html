<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 3</title>
</head>
<body style="background-color: #212121; color : #fff">
    
</body>
<script> 
    const div = document.createElement('div')
    console.log(div)
    div.className = "main"
    div.id = Math.round(Math.random()*10 + 1)
    div.setAttribute("title", "generated title") // using this is better, as it sets the attribute directly
    div.style.backgroundColor="grey"
    div.style.padding = "15px"
    div.innerHTML = "This is the div generated using JavaScript" // takes out the value set at this attribute and overwritetes it

    const addText = document.createTextNode("Chai aur code"); 
    div.appendChild(addText) // another way of adding text to the div
    // this whole operation is done in the memory here, we have to attach it to the document to see changes on the page. 

    // at last we can add this in the document
    document.body.appendChild(div)
    // now we can see changes on the page
</script>
</html>
