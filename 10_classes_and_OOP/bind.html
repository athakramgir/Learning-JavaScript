<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body style="background-color: #212121; color: #fff">
    <button>Button Clicked</button>
</body>
<script>
    class React{
        constructor(){
            this.library = "React"
            this.server = "https://localhost:3000"

            // requirement
            document
            .querySelector('button')
            .addEventListener('click', this.handleClick.bind(this)) // here we are binding 'this' with the handleClick function so it has access to the content of this class
        }
        handleClick(){
            console.log("Button Clicked")
            console.log(this.server)
        }
    }
    const app = new React()
    app.handleClick()
</script>
</html>
